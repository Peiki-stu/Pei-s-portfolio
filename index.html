<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭佩綺 · 作品集 Portfolio</title>
  <meta name="description" content="郭佩綺個人作品集：陌生益所品牌視覺、咬牙切齒資訊圖表與書籍設計、平面與社群視覺設計。">

  <!-- 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fdfbf4;
      --text: #2b2725;
      --text-muted: #6b635e;
      --accent: #967155;
      --line: rgba(150, 113, 85, 0.18);
      --card-bg: rgba(150, 113, 85, 0.035);
      --font-title: "Noto Serif TC", serif;
      --font-body: "Noto Sans TC", sans-serif;
      --max-width: 1200px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);

      --space-xs: 0.35rem;
      --space-sm: 0.5625rem;
      --space-md: 0.9375rem;
      --space-lg: 1.35rem;
      --space-xl: 2.4rem;
      --space-xxl: 3.2rem;
    }

    [data-theme="dark"] {
      --bg: #12100e;
      --text: #f2ece4;
      --text-muted: #a39990;
      --accent: #d99b64;
      --line: rgba(217, 155, 100, 0.2);
      --card-bg: rgba(217, 155, 100, 0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.35;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* 頂部導覽列 (Flexbox 兩側對齊) */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(253, 251, 244, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .site-header {
      background-color: rgba(18, 16, 14, 0.88);
    }

    .navbar {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text);
      transition: opacity 0.2s ease;
    }

    .logo:hover {
      opacity: 0.75;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      font-size: 0.88rem;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      position: relative;
      padding: 4px 0;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--accent);
    }

    .nav-link.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--accent);
      border-radius: 1px;
    }

    /* 色彩切換按鈕 */
    .theme-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: transform 0.25s var(--ease-spring), opacity 0.2s ease;
    }

    .theme-btn:hover {
      transform: scale(1.2) rotate(15deg);
      opacity: 0.85;
    }

    /* 首頁主容器 */
    .homepage-main {
      flex: 1;
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3.5rem;
    }

    /* 首頁引導標題 */
    .home-hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .home-eyebrow {
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 0.35rem;
    }

    .home-title {
      font-family: var(--font-title);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 500;
      letter-spacing: 2.5px;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .home-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 1.5px;
    }

    /* 純視覺網格佈局（上二下一） */
    .home-gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.75rem;
    }

    /* 專案卡片連結 */
    .project-card {
      display: block;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 6px 24px rgba(43, 39, 37, 0.04);
      transition: transform 0.4s var(--ease-spring), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(43, 39, 37, 0.1);
      border-color: var(--accent);
    }

    /* 卡片比例控制 */
    .card-media-wrap {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .card-media-4-3 {
      aspect-ratio: 4 / 3;
    }

    .card-media-banner {
      aspect-ratio: 21 / 9;
    }

    .project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease-smooth), filter 0.4s ease;
    }

    .project-card:hover img {
      transform: scale(1.03);
    }

    /* 專案卡片底部簡潔標籤欄 */
    .card-info-bar {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      background: var(--bg);
      transition: background 0.3s ease;
    }

    .card-title {
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text);
    }

    .card-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 300;
    }

    .card-arrow {
      font-size: 1rem;
      color: var(--accent);
      transition: transform 0.25s var(--ease-spring);
    }

    .project-card:hover .card-arrow {
      transform: translateX(4px);
    }

    /* 下方橫幅卡片橫跨兩欄 */
    .card-full-width {
      grid-column: 1 / -1;
    }

    /* 頁尾低調純文字排版 */
    .site-footer {
      margin-top: auto;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .footer-contact {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      letter-spacing: 1px;
      font-weight: 300;
    }

    .footer-contact a {
      color: inherit;
      transition: color 0.2s ease;
    }

    .footer-contact a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .copyright-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
      }
      .nav-right {
        gap: 14px;
      }
      .nav-link {
        font-size: 0.82rem;
      }
      .home-gallery-grid {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
      .card-full-width {
        grid-column: 1;
      }
      .card-media-banner {
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>

  <script>
    // 主題切換邏輯
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = themeToggle.querySelector(".theme-icon");

    const savedTheme = localStorage.getItem("peggy-portfolio-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

    const setTheme = (theme) => {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        if (themeIcon) themeIcon.textContent = "🌙";
      } else {
        document.documentElement.removeAttribute("data-theme");
        if (themeIcon) themeIcon.textContent = "☀️";
      }
      localStorage.setItem("peggy-portfolio-theme", theme);
    };

    setTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      setTheme(currentTheme === "dark" ? "light" : "dark");
    });
  </script>

  <!-- 視覺調校與文字直改開關 (A 方案 HUD) -->
